name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: DSP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake pkg-config libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig-dev libasound2-dev

      - name: Run DSP tests
        run: ./scripts/run_tests.sh

      - name: Run host tests
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --target HostTest --parallel
          ./build-test/HostTest

  build:
    name: Build VST3
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Kompressor-K3-windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/KompresorC3_artefacts/Release/VST3/Kompressor K3.vst3" -DestinationPath "Kompressor K3.vst3.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "*.zip"
          if-no-files-found: error
